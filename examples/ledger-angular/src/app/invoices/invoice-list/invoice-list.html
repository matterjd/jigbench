<div class="invoice-list">
  <div class="invoice-list__toolbar">
    <h1>Invoices</h1>
    <a class="button" routerLink="/invoices/new">New invoice</a>
  </div>

  <table class="invoice-list__table">
    <thead>
      <tr>
        <th>Number</th>
        <th>Customer</th>
        <th>Issued</th>
        <th>Due</th>
        <th>Total</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      @for (invoice of invoices(); track invoice.id) {
        <tr [routerLink]="['/invoices', invoice.id]" class="invoice-list__row">
          <td>{{ invoice.number }}</td>
          <td>{{ invoice.customerName }}</td>
          <td>{{ invoice.issuedOn }}</td>
          <td>{{ invoice.dueOn }}</td>
          <td>{{ invoice.total | money }}</td>
          <td><app-status-chip [status]="invoice.status" /></td>
        </tr>
      } @empty {
        <tr>
          <td colspan="6" class="invoice-list__empty">No invoices yet.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
