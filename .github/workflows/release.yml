name: Release (build artifact only)

# Manual only, on purpose (EXECUTION-PLAN.md §4 S10 / decision 12): this builds and packs the
# jigbench tarball and uploads it as a workflow artifact for a human to download and inspect.
# It never runs `npm publish` — v0.1 is a manual, by-hand publish on Matter's own explicit
# word, and this workflow needs no npm token / OIDC / secret of any kind to do its job.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm ci
        run: npm ci

      - name: build:release (bundle jigbench)
        run: npm run build:release

      - name: pack:release (npm pack -> jigbench-<version>.tgz)
        run: npm run pack:release

      - name: npm pack --dry-run file list (recorded in the run log)
        run: npm pack --workspace=jigbench --dry-run

      # #36: the same ship gate `.github/workflows/ci.yml` runs on every pull request, run here
      # too and BEFORE the upload — the tarball this workflow produces is the one a human
      # downloads and publishes by hand, so it has to prove itself the same way: README.md and
      # LICENSE present and byte-identical to the root files, the cli's copies untracked, then
      # survey / init / serve+health / mcp from a clean directory outside this repo. A tarball
      # that fails the control never becomes a downloadable artifact.
      - name: npx control (survey / init / serve / mcp against the packed tarball)
        shell: bash
        run: |
          TARBALL="$(ls jigbench-*.tgz | head -1)"
          bash scripts/npx-control.sh "$(pwd)/$TARBALL"

      - uses: actions/upload-artifact@v4
        with:
          name: jigbench-tarball
          path: jigbench-*.tgz
          if-no-files-found: error
